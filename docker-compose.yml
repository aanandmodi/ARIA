version: "3.9"
services:

  api:
    build: ./api
    container_name: aria-api
    restart: unless-stopped
    env_file: .env
    ports: []
    depends_on: [postgres, redis, minio]
    networks: [aria-net]
    volumes:
      - ./api:/app/api
    command: >
      gunicorn api.main:app
        -w 2 -k uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:8000
        --timeout 60 --keep-alive 5

  worker:
    build: ./api
    container_name: aria-worker
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres, redis, minio]
    networks: [aria-net]
    volumes:
      - ./api:/app/api
    command: python -m arq api.workers.settings.WorkerSettings

  baileys:
    build: ./baileys
    container_name: aria-baileys
    restart: unless-stopped
    env_file: .env
    networks: [aria-net]
    volumes:
      - baileys_session:/app/session

  postgres:
    image: postgres:16-alpine
    container_name: aria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [aria-net]

  redis:
    image: redis:7-alpine
    container_name: aria-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redis_data:/data
    networks: [aria-net]

  minio:
    image: minio/minio:latest
    container_name: aria-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [aria-net]

  nginx:
    image: nginx:1.25-alpine
    container_name: aria-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api]
    networks: [aria-net]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  baileys_session:

networks:
  aria-net:
    driver: bridge
