events { worker_connections 1024; }

http {
  upstream api {
    server api:8000;
  }

  server {
    listen 80;

    client_max_body_size 50M;

    location /webhook/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    location /internal/ {
      # Block external access — only Docker network containers can reach this
      allow 172.0.0.0/8;
      deny all;
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      proxy_pass http://api;
    }
  }
}
